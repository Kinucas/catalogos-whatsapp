        function filtrarProdutos(termo) {

            const cards = document.querySelectorAll('.produto-card');
            let visiveis = 0;
            
            cards.forEach(card => {
                const nomeEl = card.querySelector('.produto-nome');
                const nome = (nomeEl && nomeEl.textContent) ? nomeEl.textContent.toLowerCase() : '';
                const codigo = (card.dataset && card.dataset.codigo) ? card.dataset.codigo.toLowerCase() : '';
                const categoria = (card.dataset && card.dataset.categoria) ? card.dataset.categoria.toLowerCase() : '';
                
                if (termoLower === '' || nome.includes(termoLower) || codigo.includes(termoLower) || categoria.includes(termoLower)) {
                    card.style.display = 'flex';
                    visiveis++;
                } else {
                    card.style.display = 'none';
                }
            });

                                    <span style="font-weight: bold; font-size: 13px;">📦 Unidade</span>
                                    <span style="color: #FF6B1C; font-weight: bold;">R$ ${formatarPreco(precoUnidade)}</span>
                                </div>
                                <div style="display: flex; gap: 6px; align-items: center;">
                                    <input type="number" 
                                           inputmode="numeric"
                                           pattern="[0-9]*"
                                           id="qtd-un-${produto.id}" 
                                           value="1" 
                                           min="1" 
                                           placeholder="Qtd"
                                           onkeypress="if(event.key==='Enter'){adicionarAoCarrinhoComQtd('produto', ${produto.id}, 'unidade', 'qtd-un-${produto.id}'); return false;}"
                                           style="width: 85px; padding: 10px; border: 2px solid #FF8A3D; border-radius: 8px; text-align: center; font-size: 16px; font-weight: bold;">
                                    <button class="btn-adicionar" 
                                            onclick="adicionarAoCarrinhoComQtd('produto', ${produto.id}, 'unidade', 'qtd-un-${produto.id}')"
                                            style="flex: 1; padding: 10px; font-size: 14px;">
                                        🛒 Adicionar
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Opção Caixa -->
                            <div style="display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 2px solid #25D366; border-radius: 8px; background: #f0fdf4;">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="font-weight: bold; font-size: 13px;">📦📦 Caixa (${unidadesPorCaixa}un)</span>
                                    <span style="color: #128C7E; font-weight: bold;">R$ ${formatarPreco(precoCaixa)}</span>
                                </div>
                                ${economiaPercent > 0 ? `<div style="font-size: 10px; color: #128C7E; font-weight: bold;">💰 Economize ${economiaPercent}%</div>` : ''}
                                <div style="display: flex; gap: 6px; align-items: center;">
                                    <input type="number" 
                                           inputmode="numeric"
                                           pattern="[0-9]*"
                                           id="qtd-cx-${produto.id}" 
                                           value="1" 
                                           min="1"
                                           placeholder="Qtd"
                                           onkeypress="if(event.key==='Enter'){adicionarAoCarrinhoComQtd('produto', ${produto.id}, 'caixa', 'qtd-cx-${produto.id}'); return false;}" 
                                           style="width: 90px; padding: 10px; border: 2px solid #25D366; border-radius: 8px; text-align: center; font-size: 16px; font-weight: bold;">
                                    <button class="btn-adicionar" 
                                            onclick="adicionarAoCarrinhoComQtd('produto', ${produto.id}, 'caixa', 'qtd-cx-${produto.id}')"
                                            style="flex: 1; padding: 10px; font-size: 14px; background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);">
                                        🛒 Adicionar
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // Produto normal: SIMPLES - só campo de quantidade
                    botoesCompra = `
                        <div style="display: flex; gap: 8px; align-items: center; margin-top: 10px;">
                            <input type="number" 
                                   inputmode="numeric"
                                   pattern="[0-9]*"
                                   id="qtd-${produto.id}" 
                                   value="1" 
                                   min="1"
                                   placeholder="Quantidade"
                                   onkeypress="if(event.key==='Enter'){adicionarAoCarrinhoComQtd('produto', ${produto.id}, 'unidade', 'qtd-${produto.id}'); return false;}" 
                                   style="width: 80px; padding: 10px; border: 2px solid #FF8A3D; border-radius: 8px; text-align: center; font-size: 16px; font-weight: bold;">
                            <button class="btn-adicionar" 
                                    onclick="adicionarAoCarrinhoComQtd('produto', ${produto.id}, 'unidade', 'qtd-${produto.id}')"
                                    style="flex: 1; padding: 10px; font-size: 14px;">
                                🛒 Adicionar ao Carrinho
                            </button>
                        </div>
                    `;
                }
                
                // 🖼️ Usar fotoHQ (alta qualidade 800x800) se disponível, senão usa foto normal
                const imagemProduto = produto.fotoHQ || produto.foto;
                
                // 📝 Verificar se descrição é só "Importado de NF-e..." (não é descrição real do produto)
                const descricaoReal = produto.descricao && !produto.descricao.startsWith('Importado de NF-e') 
                    ? produto.descricao 
                    : '';
                
                // 📦 Informações técnicas do produto
                // 🆕 Priorizar CÓDIGO (cProd do XML) sobre EAN
                const codigoProduto = produto.codigo || produto.ean || produto.cEAN || '';
                const codigoEAN = produto.ean || produto.cEAN || produto.codigo || '';
                const codigoDUN = produto.dun || produto.cEANTrib || '';
                const dimensoes = produto.altura && produto.largura && produto.profundidade
                    ? `${produto.altura}×${produto.largura}×${produto.profundidade} cm`
                    : '';
                const peso = produto.peso ? `${produto.peso} kg` : '';
                const unidadesCaixa = produto.unidadesPorCaixa || 1;
                
                return `
                    <div class="produto-card" data-codigo="${codigoEAN}" data-categoria="${produto.categoria || ''}">
                        <div style="position: relative;">
                            <!-- DIMENSÕES - canto superior esquerdo -->
                            ${(produto.altura || produto.largura || produto.profundidade || produto.peso) ? `
                                <div style="position: absolute; top: 8px; left: 8px; background: rgba(255,255,255,0.9); border-radius: 6px; padding: 5px 8px; z-index: 10; line-height: 1.3;">
                                    ${produto.altura ? `<div style="font-size: 11px; font-weight: 700; color: #2E7D32;">↕ ${produto.altura}cm</div>` : ''}
                                    ${produto.largura ? `<div style="font-size: 11px; font-weight: 700; color: #1976D2;">↔ ${produto.largura}cm</div>` : ''}
                                    ${produto.profundidade ? `<div style="font-size: 11px; font-weight: 700; color: #7B1FA2;">↔ ${produto.profundidade}cm</div>` : ''}
                                    ${produto.peso ? `<div style="font-size: 11px; font-weight: 700; color: #F57C00;">⚖ ${produto.peso}kg</div>` : ''}
                                </div>
                            ` : ''}
                            
                            <!-- UN/CAIXA - canto superior direito -->
                            <div style="position: absolute; top: 8px; right: 8px; background: #FF6F00; border: 3px solid #fff; border-radius: 50%; width: 65px; height: 65px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,0.4); z-index: 10;">
                                <span style="font-size: 26px; font-weight: 900; color: #fff; line-height: 1;">${unidadesCaixa}</span>
                                <span style="font-size: 10px; font-weight: 600; color: #fff; margin-top: 2px;">un/cx</span>
                            </div>
                            
                            <!-- PRECO SIMPLES - canto inferior esquerdo -->
                            ${mostrarPrecos && produto.preco ? `
                                <div style="position: absolute; bottom: 10px; left: 10px; background: #FFEB3B; border: 3px solid #E65100; border-radius: 8px; padding: 8px 12px; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
                                    <div style="font-size: 22px; font-weight: 900; color: #E65100; line-height: 1;">R$ ${formatarPreco(produto.preco)}</div>
                                    <div style="font-size: 9px; font-weight: 600; color: #BF360C; text-align: center;">cada</div>
                                </div>
                            ` : ''}
                            
                            ${imagemProduto 
                                ? (imagemProduto.startsWith('data:') 
                                    ? `<img src="${imagemProduto}" class="produto-imagem" alt="${produto.nome}">`
                                    : `<img src="file://${imagemProduto}" class="produto-imagem" alt="${produto.nome}">`)
                                : '<div class="produto-imagem" style="display: flex; align-items: center; justify-content: center; font-size: 48px; background: #ffffff;">📦</div>'}
                        </div>
                        <div class="produto-info">
                            <div class="produto-nome">${produto.nome}</div>
                            ${codigoProduto && codigoProduto.trim() ? `<div style="text-align: center; margin-bottom: 8px;"><span style="font-size: 11px; font-weight: 600; color: #555;">Cód: ${codigoProduto}</span></div>` : ''}
                            ${botoesCompra}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderizarServicos() {
            const lista = document.getElementById('servicosLista');
            if (!lista || servicos.length === 0) return;
            
            const servicosHTML = servicos.map(servico => `
                <div class="servico-card">
                    <div class="servico-icone">⚙️</div>
                    <div class="servico-info">
                        <div class="servico-nome">${servico.nome}</div>
                        ${servico.descricao ? `<div class="servico-descricao">${servico.descricao}</div>` : ''}
                    </div>
                    ${mostrarPrecos ? `<div class="servico-preco">R$ ${formatarPreco(servico.preco || 0)}</div>` : ''}
                    <button class="btn-adicionar" onclick="adicionarAoCarrinho('servico', ${servico.id})">
                        🛒 Adicionar
                    </button>
                </div>
            `).join('');
            
            lista.innerHTML += servicosHTML;
        }
        
        function adicionarAoCarrinho(tipo, id, tipoVenda) {
            tipoVenda = tipoVenda || 'unidade';
            var item = tipo === 'produto' ? 
                produtos.find(function(p) { return p.id === id; }) : 
                servicos.find(function(s) { return s.id === id; });
            
            if (!item) return;
            
            // 🆕 Determinar preço baseado no tipo de venda
            var preco = item.preco || 0;
            var unidadesPorCaixa = item.unidadesPorCaixa || 1;
            
            if (tipo === 'produto' && tipoVenda === 'caixa') {
                preco = item.precoCaixa || (item.preco * unidadesPorCaixa);
            }
            
            // 🆕 Chave única: considera produto + tipo de venda
            var chaveItem = tipo + '_' + id + '_' + tipoVenda;
            var itemCarrinho = carrinho.find(function(i) { 
                return (i.tipo + '_' + i.id + '_' + (i.tipoVenda || 'unidade')) === chaveItem; 
            });
            
            if (itemCarrinho) {
                itemCarrinho.quantidade++;
            } else {
                carrinho.push({
                    tipo: tipo,
                    id: id,
                    nome: item.nome + (tipoVenda === 'caixa' ? ' (Caixa ' + unidadesPorCaixa + 'un)' : ''),
                    nomeOriginal: item.nome,
                    preco: preco,
                    precoUnitario: item.preco || 0,
                    quantidade: 1,
                    tipoVenda: tipoVenda,
                    unidadesPorCaixa: unidadesPorCaixa
                });
            }
            
            atualizarCarrinho();
            salvarCarrinhoLocalStorage();
            
            // Feedback visual - FIX para iOS/Safari
            try {
                const btn = window.event ? window.event.target || window.event.srcElement : null;
                if (btn && btn.classList) {
                    const textoOriginal = btn.innerHTML;
                    btn.classList.add('adicionado');
                    btn.innerHTML = '✓ Adicionado!';
                    setTimeout(() => {
                        btn.classList.remove('adicionado');
                        btn.innerHTML = textoOriginal;
                    }, 1000);
                }
            } catch (e) {
                console.log('Feedback visual não disponível');
            }
        }
        
        // 🆕 ADICIONAR AO CARRINHO COM QUANTIDADE DO INPUT
        function adicionarAoCarrinhoComQtd(tipo, id, tipoVenda, inputId) {
            tipoVenda = tipoVenda || 'unidade';
            const inputQtd = document.getElementById(inputId);
            const quantidade = parseInt(inputQtd && inputQtd.value ? inputQtd.value : 1) || 1;
            
            if (quantidade < 1) {
                alert('Quantidade inválida!');
                return;
            }
            
            const item = tipo === 'produto' ? 
                produtos.find(function(p) { return p.id === id; }) : 
                servicos.find(function(s) { return s.id === id; });
            
            if (!item) return;
            
            // Determinar preço baseado no tipo de venda
            let preco = item.preco || 0;
            let unidadesPorCaixa = item.unidadesPorCaixa || 1;
            
            if (tipo === 'produto' && tipoVenda === 'caixa') {
                preco = item.precoCaixa || (item.preco * unidadesPorCaixa);
            }
            
            // Chave única: considera produto + tipo de venda
            const chaveItem = `${tipo}_${id}_${tipoVenda}`;
            const itemCarrinho = carrinho.find(i => `${i.tipo}_${i.id}_${i.tipoVenda || 'unidade'}` === chaveItem);
            
            if (itemCarrinho) {
                itemCarrinho.quantidade += quantidade; // Soma a quantidade digitada
            } else {
                carrinho.push({
                    tipo,
                    id,
                    nome: item.nome + (tipoVenda === 'caixa' ? ` (Caixa ${unidadesPorCaixa}un)` : ''),
                    nomeOriginal: item.nome,
                    preco: preco,
                    precoUnitario: item.preco || 0,
                    quantidade: quantidade, // Usa a quantidade digitada
                    tipoVenda: tipoVenda,
                    unidadesPorCaixa: unidadesPorCaixa
                });
            }
            
            atualizarCarrinho();
            salvarCarrinhoLocalStorage();
            
            // Feedback visual - FIX para iOS/Safari
            try {
                const btn = window.event ? window.event.target || window.event.srcElement : null;
                if (btn && btn.classList) {
                    const textoOriginal = btn.innerHTML;
                    btn.classList.add('adicionado');
                    btn.innerHTML = `✓ ${quantidade} adicionado(s)!`;
                    setTimeout(() => {
                        btn.classList.remove('adicionado');
                        btn.innerHTML = textoOriginal;
                    }, 1500);
                }
            } catch (e) {
                console.log('Feedback visual não disponível');
            }
            
            // Resetar input para 1
            if (inputQtd) inputQtd.value = 1;
        }
        
        // 🆕 AJUSTAR QUANTIDADE NO INPUT COM BOTÕES +/-
        function ajustarQtdInput(inputId, delta) {
            const input = document.getElementById(inputId);
            if (!input) return;
            
            const valorAtual = parseInt(input.value) || 1;
            const novoValor = Math.max(1, valorAtual + delta);
            input.value = novoValor;
        }
        
        function removerDoCarrinho(tipo, id, tipoVenda = 'unidade') {
            const chaveItem = `${tipo}_${id}_${tipoVenda}`;
            carrinho = carrinho.filter(i => `${i.tipo}_${i.id}_${i.tipoVenda || 'unidade'}` !== chaveItem);
            atualizarCarrinho();
            salvarCarrinhoLocalStorage();
        }
        
        function alterarQuantidade(tipo, id, delta, tipoVenda = 'unidade') {
            const chaveItem = `${tipo}_${id}_${tipoVenda}`;
            const item = carrinho.find(i => `${i.tipo}_${i.id}_${i.tipoVenda || 'unidade'}` === chaveItem);
            if (!item) return;
            
            item.quantidade = Math.max(1, item.quantidade + delta);
            atualizarCarrinho();
            salvarCarrinhoLocalStorage();
        }
        
        function atualizarCarrinho() {
            var badge = document.getElementById('carrinhoBadge');
            var itensDiv = document.getElementById('carrinhoItens');
            var totalDiv = document.getElementById('carrinhoTotal');
            var btnWhatsapp = document.getElementById('btnWhatsapp');
            
            if (!badge || !itensDiv) return;
            
            // Calcular total considerando unidades dentro das caixas
            var totalItens = 0;
            for (var i = 0; i < carrinho.length; i++) {
                var item = carrinho[i];
                if (item.tipoVenda === 'caixa') {
                    totalItens += item.quantidade * (item.unidadesPorCaixa || 1);
                } else {
                    totalItens += item.quantidade;
                }
            }
            badge.textContent = totalItens;
            
            if (carrinho.length === 0) {
                itensDiv.innerHTML = '<div class="carrinho-vazio"><p>Seu carrinho está vazio</p><p style="font-size: 12px; margin-top: 10px;">Adicione produtos para começar!</p></div>';
                totalDiv.style.display = 'none';
                btnWhatsapp.style.display = 'none';
                return;
            }
            
            // Renderizar itens com informação de caixa
            var itensHTML = '';
            for (var j = 0; j < carrinho.length; j++) {
                var item = carrinho[j];
                var tipoVenda = item.tipoVenda || 'unidade';
                var isCaixa = tipoVenda === 'caixa';
                var infoExtra = isCaixa && item.unidadesPorCaixa > 1 
                    ? '<div style="font-size: 10px; color: #888;">📦 ' + item.quantidade + ' cx × ' + item.unidadesPorCaixa + ' = ' + (item.quantidade * item.unidadesPorCaixa) + ' un</div>'
                    : '';
                
                itensHTML += '<div class="carrinho-item">' +
                    '<div class="carrinho-item-info">' +
                        '<div class="carrinho-item-nome">' +
                            (isCaixa ? '📦 ' : '') + (item.nomeOriginal || item.nome) +
                            (isCaixa ? '<span style="background: #25D366; color: white; font-size: 9px; padding: 1px 4px; border-radius: 3px; margin-left: 4px;">CAIXA</span>' : '') +
                        '</div>' +
                        '<div class="carrinho-item-preco">R$ ' + formatarPreco(item.preco * item.quantidade) + (isCaixa ? '/total' : '') + '</div>' +
                        infoExtra +
                        '<div class="carrinho-item-qtd">' +
                            '<button onclick="alterarQuantidade(\''+item.tipo+'\', '+item.id+', -1, \''+tipoVenda+'\')">−</button>' +
                            '<input type="number" value="'+item.quantidade+'" readonly>' +
                            '<button onclick="alterarQuantidade(\''+item.tipo+'\', '+item.id+', 1, \''+tipoVenda+'\')">+</button>' +
                        '</div>' +
                    '</div>' +
                    '<button class="btn-remover" onclick="removerDoCarrinho(\''+item.tipo+'\', '+item.id+', \''+tipoVenda+'\')">🗑️</button>' +
                '</div>';
            }
            itensDiv.innerHTML = itensHTML;
            
            var total = 0;
            for (var k = 0; k < carrinho.length; k++) {
                total += carrinho[k].preco * carrinho[k].quantidade;
            }
            document.getElementById('totalValor').textContent = formatarPreco(total);
            totalDiv.style.display = 'block';
            btnWhatsapp.style.display = 'flex';
        }
        
        function enviarPedidoWhatsApp() {
            if (carrinho.length === 0) {
                alert('Adicione itens ao carrinho primeiro!');
                return;
            }
            
            var mensagem = mensagemInicial + '\n\n';
            mensagem += '📋 *PEDIDO DO CATÁLOGO*\n';
            mensagem += '━━━━━━━━━━━━━━━━\n\n';
            
            // Calcular totais de unidades e caixas
            var totalUnidades = 0;
            var totalCaixas = 0;
            
            for (var i = 0; i < carrinho.length; i++) {
                var item = carrinho[i];
                var tipoVenda = item.tipoVenda || 'unidade';
                var isCaixa = tipoVenda === 'caixa';
                var nomeExibir = item.nomeOriginal || item.nome;
                
                if (isCaixa) {
                    var unidadesNaCaixa = item.unidadesPorCaixa || 1;
                    var totalUnidadesItem = item.quantidade * unidadesNaCaixa;
                    totalCaixas += item.quantidade;
                    totalUnidades += totalUnidadesItem;
                    
                    mensagem += (i + 1) + '. 📦📦 *' + nomeExibir + '* (CAIXA)\n';
                    mensagem += '   Qtd: ' + item.quantidade + ' caixa(s) × ' + unidadesNaCaixa + ' un = ' + totalUnidadesItem + ' unidades\n';
                } else {
                    totalUnidades += item.quantidade;
                    mensagem += (i + 1) + '. 📦 *' + nomeExibir + '*\n';
                    mensagem += '   Qtd: ' + item.quantidade + ' unidade(s)\n';
                }
                
                if (mostrarPrecos) {
                    mensagem += '   Preço: R$ ' + formatarPreco(item.preco) + (isCaixa ? '/cx' : '/un') + '\n';
                    mensagem += '   Subtotal: R$ ' + formatarPreco(item.preco * item.quantidade) + '\n';
                }
                mensagem += '\n';
            }
            
            var total = 0;
            for (var j = 0; j < carrinho.length; j++) {
                total += carrinho[j].preco * carrinho[j].quantidade;
            }
            
            mensagem += '━━━━━━━━━━━━━━━━\n';
            
            // Resumo de quantidades
            if (totalCaixas > 0) {
                mensagem += '📦 Total: ' + totalUnidades + ' unidades (' + totalCaixas + ' caixas)\n';
            } else {
                mensagem += '📦 Total: ' + totalUnidades + ' unidades\n';
            }
            
            if (mostrarPrecos) {
                mensagem += '💰 *VALOR TOTAL: R$ ' + formatarPreco(total) + '*\n';
            }
            
            var whatsappUrl = 'https://wa.me/' + whatsappNumero + '?text=' + encodeURIComponent(mensagem);
            window.open(whatsappUrl, '_blank');
        }
        
        function formatarPreco(valor) {
            return parseFloat(valor || 0).toFixed(2).replace('.', ',');
        }
        
        function salvarCarrinhoLocalStorage() {
            try {
                localStorage.setItem('carrinho_catalogo', JSON.stringify(carrinho));
            } catch (e) {
                console.warn('localStorage não disponível (modo privado?):', e);
            }
        }
        
        function carregarCarrinhoLocalStorage() {
            try {
                const carrinhoSalvo = localStorage.getItem('carrinho_catalogo');
                if (carrinhoSalvo) {
                    carrinho = JSON.parse(carrinhoSalvo);
                    atualizarCarrinho();
                }
            } catch (e) {
                console.warn('Erro ao carregar carrinho do localStorage:', e);
            }
        }
    </script>
</body>
</html>
